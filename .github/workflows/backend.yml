name: Deploy Backend to HuggingFace

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MORROCOFAN30
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push Backend to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # Debug - afficher la structure
          echo "=== Structure du repo ==="
          ls -la

          # Détecter le dossier backend (majuscule ou minuscule)
          BACKEND_DIR=$(ls -d [Bb]ackend 2>/dev/null | head -1)
          echo "=== Backend trouvé: $BACKEND_DIR ==="
          ls -la $BACKEND_DIR

          # Clone HuggingFace Space
          git clone https://Anas-gana1:$HF_TOKEN@huggingface.co/spaces/Anas-gana1/fandb-backend hf-repo

          # Copier src, pom.xml et Dockerfile
          cp -r $BACKEND_DIR/src hf-repo/
          cp $BACKEND_DIR/pom.xml hf-repo/
          cp $BACKEND_DIR/Dockerfile hf-repo/

          # Push vers HuggingFace
          cd hf-repo
          git add .
          git diff --staged --quiet || git commit -m "sync from GitHub - $GITHUB_SHA"
          git push