name: Deploy Backend to HuggingFace

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/demo/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: |
          cd Backend/demo
          mvn clean package -DskipTests

      - name: SonarQube Analysis
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          npm install -g sonar-scanner
          sonar-scanner -Dsonar.token=$SONAR_TOKEN

      - name: Push to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          git clone https://Anas-gana1:$HF_TOKEN@huggingface.co/spaces/Anas-gana1/fandb-backend hf-repo

          # ✅ Supprimer l'ancien src avant de recopier (évite les fichiers fantômes)
          rm -rf hf-repo/src

          # Copier tous les fichiers frais depuis GitHub
          cp -r Backend/demo/src hf-repo/
          cp Backend/demo/pom.xml hf-repo/
          cp Backend/demo/Dockerfile hf-repo/

          cd hf-repo
          git add -A

          # ✅ --allow-empty force le push même si git pense que rien n'a changé
          git commit --allow-empty -m "sync from GitHub - $GITHUB_SHA"
          git push

          echo "✅ HuggingFace mis à jour : $(git log --oneline -1)"