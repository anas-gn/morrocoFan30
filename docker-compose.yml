services:

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    command: --lower_case_table_names=1
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: fandb
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    networks:
      - app-network

  backend:
    build:
      context: ./Backend/demo
      dockerfile: Dockerfile
    container_name: springboot_app
    restart: always
    depends_on:
      - db
    ports:
      - "3309:3309"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/fandb?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextjs_app
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3309
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge